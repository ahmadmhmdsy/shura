name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No provider credential exists in this workflow. The E2E suite answers every
  # provider origin from an in-page mock, so a real request is impossible here.
  CI: "true"

jobs:
  web:
    name: Web gates (typecheck, lint, coverage, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, coverage, build
        run: pnpm check:all
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Mocked end-to-end suite
        run: pnpm test:e2e
      - name: Report JavaScript dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pnpm audit --json > audit.json || true
          node -e "const a=require('./audit.json');const v=a.metadata&&a.metadata.vulnerabilities||{};console.log('JS audit advisories:', JSON.stringify(v));if(Object.keys(v).length)process.exitCode=1"

  rust:
    name: Rust gates (fmt, check, test, audit report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: cargo check --locked
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: cargo test --locked
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Report cargo-audit (non-blocking, unavailable when not installed)
        continue-on-error: true
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            echo "SKIPPED: cargo-audit REASON: cargo-audit is not installed on this runner (cargo install cargo-audit, then re-run)"
            exit 0
          fi
          cargo install cargo-audit --locked
          cargo audit

  nsis:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the NSIS installer
        run: pnpm tauri:build:windows
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: shura-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
